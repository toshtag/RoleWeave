id: P15
name: Post-V1 Options
weight: 3
confidence: low
risk: low
status: planned
depends_on:
  - P12
objective: |-
  利用実績や外部要望を確認してから、追加投資の対象を判断する。
  このフェーズは検討候補の一覧であり、実装の約束ではない。
  候補機能を一括で実装するフェーズではなく、P13 と P14 の完了を待つ必要もない。
  実測、利用実績、企業等からの具体的な要望を契機として、候補を個別に評価する。
  採用した候補は独立タスクとして切り出し、
  その実装に P13 または P14 が必要な場合は、個別タスク側で依存関係を定義する。

  前提フェーズ: P12

  対象範囲: OpenSearch / SSO / Google Calendar / Microsoft 365 / Salesforce /
  HubSpot / Slack / ビデオ会議 / 高度な分析 / AI による文書作成補助 /
  マネージドホスティング / 企業専用 PoC / 商用サポート
non_goals:
  - 要望の裏付けがないままの実装着手
  - 複数候補の同時着手
  - 列挙された全候補を一括して評価すること
  - P13 と P14 の完了を P15 開始の必須条件にすること
definition_of_done:
  - 需要シグナルが発生して評価対象となった候補について、採用・不採用・保留の判断が ADR として記録されている
  - 採用された候補について、実装範囲、依存関係、非目標を持つ独立タスクが定義されている
  - 需要シグナルが発生していない候補について、ADR の作成を完了条件としない
verification:
  commands:
    - docker compose run --rm app bin/verify
