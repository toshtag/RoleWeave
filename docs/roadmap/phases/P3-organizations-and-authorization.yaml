id: P3
name: Organizations and Authorization
weight: 8
confidence: medium
risk: high
status: in_progress
depends_on:
  - P2
objective: |-
  企業・団体と、その担当者の権限を管理できるようにする。

  前提フェーズ: P2

  対象範囲: 組織 / メンバー / 招待 / ロール / 権限 / 組織間データ分離 /
  運営者権限 / 権限変更履歴
non_goals:
  - 求人管理機能
  - 課金
  - 組織の階層構造
definition_of_done:
  - 組織を作成しメンバーを招待できる
  - ロールに応じて操作が制限される
  - 他組織のデータを参照できない
  - 権限変更が履歴として残る
verification:
  commands:
    - docker compose run --rm app bin/verify
