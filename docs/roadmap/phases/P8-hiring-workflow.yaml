id: P8
name: Hiring Workflow
weight: 9
confidence: medium
risk: medium
status: done
depends_on:
  - P7
objective: |-
  企業担当者が応募者の選考を管理できるようにする。

  前提フェーズ: P7

  対象範囲: 選考ステージ / ステージ変更履歴 / 担当者 / 評価 / コメント /
  面談・面接予定 / 内定 / 辞退 / 不採用 / 期限 / 監査記録
non_goals:
  - カレンダー連携
  - ビデオ会議連携
  - 評価の自動化
definition_of_done:
  - 応募を選考ステージ間で移動できる
  - ステージ変更が履歴として残る
  - 評価とコメントを記録できる
  - 内定・辞退・不採用を確定できる
  - 権限のない担当者は選考を操作できない
verification:
  commands:
    - docker compose run --rm app bin/verify
