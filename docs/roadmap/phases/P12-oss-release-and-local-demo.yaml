id: P12
name: OSS Release and Local Demo
weight: 6
confidence: medium
risk: low
status: in_progress
depends_on:
  - P11
objective: |-
  第三者が安全かつ簡単に評価できる最初の OSS リリースを作る。
  v0.1.0 の範囲は P0 から P12 までとし、
  スカウトおよび汎用外部連携を必須条件にしない。

  前提フェーズ: P11

  対象範囲: 架空データ / デモ用シード / ロール別の操作手順 / スクリーンショット /
  操作動画 / セットアップ文書 / アーキテクチャ文書 / コントリビューションガイド /
  セキュリティポリシー / リリース手順 / v0.1.0
non_goals:
  - 常設公開環境の構築
  - マネージドホスティングの提供
  - 商用サポートの提供
  - スカウトおよび汎用外部連携を v0.1.0 の必須条件にすること
definition_of_done:
  - 架空データのみでデモシードが投入できる
  - ロール別の操作手順が文書化されている
  - セットアップ文書だけで第三者が起動できる
  - コントリビューションガイドとセキュリティポリシーが存在する
  - v0.1.0 のタグとリリース手順が存在する
verification:
  commands:
    - docker compose run --rm app bin/verify
