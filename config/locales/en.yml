      organization:
        name: Organization name
      user:
        email_address: Email address
        password: Password
        password_confirmation: Password confirmation
    errors:
      models:
        job_application:
          attributes:
            decide_by:
              in_the_past: cannot be in the past
            assignee:
              not_a_member: is not a member of this organization
            job_posting:
              not_published: is not accepting applications
            candidate_profile_id:
              taken: has already applied to this job posting
        job_posting:
          attributes:
            annual_salary_max:
              less_than_minimum: cannot be lower than the minimum annual salary
        application_review:
          attributes:
            base:
              blank_review: needs a rating or a comment
        interview_schedule:
          attributes:
            starts_at:
              in_the_past: cannot be in the past
        scout:
          attributes:
            candidate_profile:
              not_searchable: is not accepting messages
              blocked: has stopped messages from this organization
            base:
              daily_limit_reached: The daily sending limit has been reached
        webhook:
          attributes:
            url:
              invalid_scheme: must start with http or https
            event_kinds:
              unknown: contains an unknown event type
        candidate_profile:
          attributes:
            resume:
              invalid_content_type: must be a PDF file
              too_large: is too large
            curriculum_vitae:
              invalid_content_type: must be a PDF file
              too_large: is too large
        desired_condition:
          attributes:
            salary_currency:
              incomplete_salary: and the salary must both be filled in or both be left blank
        education:
          attributes:
            ended_on:
              before_start: can't be earlier than the start date
            started_on:
              in_the_future: can't be in the future
        work_experience:
          attributes:
            ended_on:
              before_start: can't be earlier than the start date
            started_on:
              in_the_future: can't be in the future
        membership:
          attributes:
            role:
              self_change: cannot be changed by yourself
              last_owner: cannot be changed for the last administrator
