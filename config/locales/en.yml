en:
  # モデル名と属性名は、検証エラーの文言と画面の項目名の両方から参照される。
  # 片方だけで訳すと、同じ項目が場所によって違う名前で表示される。
  activerecord:
    models:
      user: Account
    attributes:
      user:
        email_address: Email address
        password: Password
        password_confirmation: Password confirmation
  application:
    name: RoleWeave
    skip_to_content: Skip to main content
    account:
      label: Account
      sign_in: Sign in
      sign_up: Sign up
      sign_out: Sign out
    language_switcher:
      label: Display language
      # 言語名は訳さず、その言語自身の表記で書く。
      # 訳すと、その言語しか読めない閲覧者が自分の言語を見つけられない。
      languages:
        ja: 日本語
        en: English
    footer:
      description: An open-source project building a self-hostable recruiting platform.
  confirmations:
    show:
      confirmed:
        title: Your email address is confirmed
        body: This email address has been confirmed. You can continue using your account.
        continue: Go to the home page
      invalid:
        title: This link cannot be used
        body: The link has expired or is no longer valid. Please try creating your account again.
        sign_up: Go to account creation
  registrations:
    new:
      title: Create an account
      submit: Create account
      password_hint: "Use at least %{count} characters. Any characters are allowed."
      sign_in: Already have an account? Sign in
  sessions:
    new:
      title: Sign in
      submit: Sign in
      sign_up: Create an account
    create:
      failure: The email address or password is incorrect.
  home:
    show:
      summary: We are building the foundation of a self-hostable recruiting platform.
  user_mailer:
    email_confirmation:
      subject: Confirm your email address
      greeting: Thank you for using RoleWeave.
      body: Open the following URL to confirm your email address.
      expiration: This URL is valid for %{count} hours.
      ignore: If you did not request this, please discard this email.
