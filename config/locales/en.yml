en:
  accounts:
    show:
      title: Account
      confirmed_at: Email address confirmed at
  # モデル名と属性名は、検証エラーの文言と画面の項目名の両方から参照される。
  # 片方だけで訳すと、同じ項目が場所によって違う名前で表示される。
  activerecord:
    models:
      job_posting: Job posting
      invitation: Invitation
      organization: Organization
      membership: Membership
      user: Account
    attributes:
      job_posting:
        title: Title
        description: Job description
        location: Location
        occupation: Occupation
        employment_type: Employment type
        salary: Salary
        requirements: Requirements
      invitation:
        email_address: Email address to invite
        role: Role
      organization:
        name: Organization name
      user:
        email_address: Email address
        password: Password
        password_confirmation: Password confirmation
    errors:
      models:
        membership:
          attributes:
            role:
              self_change: cannot be changed by yourself
              last_owner: cannot be changed for the last administrator
  application:
    name: RoleWeave
    skip_to_content: Skip to main content
    account:
      label: Account
      sign_in: Sign in
      sign_up: Sign up
      sign_out: Sign out
      organizations: Organizations
    language_switcher:
      label: Display language
      # 言語名は訳さず、その言語自身の表記で書く。
      # 訳すと、その言語しか読めない閲覧者が自分の言語を見つけられない。
      languages:
        ja: 日本語
        en: English
    footer:
      description: An open-source project building a self-hostable recruiting platform.
  confirmations:
    pending:
      title: Email confirmation required
      body: "Open the link in the confirmation email we sent to %{email_address}. You can use this page once it is confirmed."
      back: Go to the home page
    show:
      confirmed:
        title: Your email address is confirmed
        body: This email address has been confirmed. You can continue using your account.
        continue: Go to the home page
      invalid:
        title: This link cannot be used
        body: The link has expired or is no longer valid. Please try creating your account again.
        sign_up: Go to account creation
  registrations:
    new:
      title: Create an account
      submit: Create account
      password_hint: "Use at least %{count} characters. Any characters are allowed."
      sign_in: Already have an account? Sign in
  invitations:
    new:
      title: "Invite someone to %{organization}"
      submit: Send invitation
    invalid:
      title: This invitation cannot be used
      body: The invitation has expired or has already been used. Ask the organization to send a new one.
      organizations: Go to your organizations
    mismatched:
      title: This invitation is for a different email address
      body: "You are signed in as %{email_address}. Sign in with the invited email address instead."
      organizations: Go to your organizations
  operator:
    organizations:
      index:
        title: All organizations
        owner_count: "%{count} administrator(s)"
      show:
        title: "Operating %{organization}"
        grant_owner: Make administrator
        back: Back to all organizations
  organizations:
    index:
      title: Your organizations
      empty: You do not belong to any organization yet.
      new: Create an organization
      members: View members
      job_postings: View job postings
    new:
      title: Create an organization
      submit: Create organization
  job_postings:
    index:
      title: "Job postings of %{organization}"
      new: Create a job posting
      edit: Edit
      empty: There are no job postings yet.
    new:
      title: "Create a job posting for %{organization}"
      submit: Save as draft
    edit:
      title: Edit job posting
      submit: Save
    form:
      unspecified: Not specified
    statuses:
      draft: Draft
    employment_types:
      full_time: Full-time
      part_time: Part-time
      contract: Contract
      internship: Internship
  memberships:
    index:
      title: "Members of %{organization}"
      change_role: Change role
      submit: Change
      invite: Invite a member
      history: Change history
      joined: joined as %{role}
      role_changed: changed role from %{from} to %{to}
      changed_by: "(by %{email_address})"
      removed_account: deleted account
    roles:
      owner: Administrator
      member: Member
  password_resets:
    new:
      title: Reset your password
      body: Enter your registered email address. We will send you a link to reset your password.
      submit: Send the reset link
    create:
      title: Reset link sent
      body: If the email address you entered is registered, an email with a reset link will arrive shortly. If it does not, check the address you entered and your spam folder.
      sign_in: Go to sign in
    edit:
      title: Set a new password
      submit: Set password
    update:
      success: Your password has been reset. Sign in with your new password.
    invalid:
      title: This link cannot be used
      body: The link has expired or has already been used. Please request a new reset link.
      retry: Request a reset link
  sessions:
    new:
      title: Sign in
      submit: Sign in
      sign_up: Create an account
      password_reset: Forgot your password?
    create:
      failure: The email address or password is incorrect.
  home:
    show:
      summary: We are building the foundation of a self-hostable recruiting platform.
  user_mailer:
    email_confirmation:
      subject: Confirm your email address
      greeting: Thank you for using RoleWeave.
      body: Open the following URL to confirm your email address.
      expiration: This URL is valid for %{count} hours.
      ignore: If you did not request this, please discard this email.
    password_reset:
      subject: Reset your password
      greeting: We received a request to reset your password.
      body: Open the following URL to set a new password.
      expiration: This URL is valid for %{count} minutes.
      ignore: If you did not request this, discard this email. Your password will not change.
  organization_mailer:
    invitation:
      subject: "Invitation to %{organization}"
      greeting: "You have been invited to join %{organization}."
      body: Open the following URL to accept the invitation. Sign in with the invited email address first.
      expiration: This URL is valid for %{count} days.
      ignore: If you did not expect this, discard this email.
