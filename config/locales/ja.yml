ja:
  # モデル名と属性名は、検証エラーの文言と画面の項目名の両方から参照される。
  # 片方だけで訳すと、同じ項目が場所によって違う名前で表示される。
  activerecord:
    models:
      user: アカウント
    attributes:
      user:
        email_address: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認用）
    # bcrypt が切り捨てる長さは文字数ではなくバイト数で決まる。
    # 既定の文言は文字数を前提にしているため、この検証専用の文言を持つ。
    errors:
      models:
        user:
          attributes:
            password:
              too_long_in_bytes: は %{count} バイト以内で入力してください
  application:
    name: RoleWeave
    skip_to_content: 本文へ移動
    language_switcher:
      label: 表示言語
      # 言語名は訳さず、その言語自身の表記で書く。
      # 訳すと、その言語しか読めない閲覧者が自分の言語を見つけられない。
      languages:
        ja: 日本語
        en: English
    footer:
      description: 自己ホスト可能な採用プラットフォームを開発するオープンソースプロジェクトです。
  home:
    show:
      summary: 自己ホスト可能な採用プラットフォームの基盤を開発しています。
