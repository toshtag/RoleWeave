ja:
  # モデル名と属性名は、検証エラーの文言と画面の項目名の両方から参照される。
  # 片方だけで訳すと、同じ項目が場所によって違う名前で表示される。
  activerecord:
    models:
      user: アカウント
    attributes:
      user:
        email_address: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認用）
  application:
    name: RoleWeave
    skip_to_content: 本文へ移動
    account:
      label: アカウント
      sign_in: ログイン
      sign_up: アカウント作成
      sign_out: ログアウト
    language_switcher:
      label: 表示言語
      # 言語名は訳さず、その言語自身の表記で書く。
      # 訳すと、その言語しか読めない閲覧者が自分の言語を見つけられない。
      languages:
        ja: 日本語
        en: English
    footer:
      description: 自己ホスト可能な採用プラットフォームを開発するオープンソースプロジェクトです。
  registrations:
    new:
      title: アカウント作成
      submit: アカウントを作成する
      password_hint: "%{count} 文字以上で入力してください。文字の種類は問いません。"
      sign_in: すでにアカウントをお持ちの方はこちら
  sessions:
    new:
      title: ログイン
      submit: ログインする
      sign_up: アカウントをお持ちでない方はこちら
    create:
      failure: メールアドレスまたはパスワードが正しくありません。
  home:
    show:
      summary: 自己ホスト可能な採用プラットフォームの基盤を開発しています。
