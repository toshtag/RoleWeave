ja:
  accounts:
    show:
      title: アカウント情報
      confirmed_at: メールアドレスの確認日時
  # モデル名と属性名は、検証エラーの文言と画面の項目名の両方から参照される。
  # 片方だけで訳すと、同じ項目が場所によって違う名前で表示される。
  activerecord:
    models:
      candidate_profile: プロフィール
      job_posting: 求人
      invitation: 招待
      organization: 組織
      membership: 所属
      user: アカウント
    attributes:
      candidate_profile:
        display_name: 表示名
        introduction: 自己紹介
        location: 所在地
        desired_occupation: 希望職種
      job_posting:
        title: 題名
        description: 仕事内容
        location: 勤務地
        occupation: 職種
        employment_type: 雇用形態
        salary: 給与
        requirements: 応募条件
        salary_currency: 給与の通貨
        annual_salary_min: 年収の下限
        annual_salary_max: 年収の上限
        annual_salary: 年収
      invitation:
        email_address: 招待するメールアドレス
        role: 役割
      organization:
        name: 組織名
      user:
        email_address: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認用）
    errors:
      models:
        job_posting:
          attributes:
            annual_salary_max:
              less_than_minimum: は年収の下限を下回れません
        membership:
          attributes:
            role:
              self_change: は自分では変更できません
              last_owner: は組織の最後の管理者から変更できません
  application:
    name: RoleWeave
    skip_to_content: 本文へ移動
    account:
      label: アカウント
      sign_in: ログイン
      sign_up: アカウント作成
      sign_out: ログアウト
      organizations: 組織
      profile: プロフィール
    language_switcher:
      label: 表示言語
      # 言語名は訳さず、その言語自身の表記で書く。
      # 訳すと、その言語しか読めない閲覧者が自分の言語を見つけられない。
      languages:
        ja: 日本語
        en: English
    footer:
      description: 自己ホスト可能な採用プラットフォームを開発するオープンソースプロジェクトです。
  candidate_profiles:
    show:
      title: プロフィール
      edit: プロフィールを編集する
    new:
      title: プロフィールの作成
      body: 応募のときに企業へ伝える情報です。表示名だけが必須で、ほかは後から追加できます。
      submit: プロフィールを作成する
    edit:
      title: プロフィールの編集
      submit: 保存する
  confirmations:
    pending:
      title: メールアドレスの確認が必要です
      body: "%{email_address} 宛に送った確認メールのリンクを開いてください。確認が完了すると、この画面を利用できます。"
      back: トップページへ
    show:
      confirmed:
        title: メールアドレスを確認しました
        body: このメールアドレスの確認が完了しました。引き続きご利用いただけます。
        continue: トップページへ
      invalid:
        title: このリンクは使用できません
        body: リンクの有効期限が切れているか、すでに使用できない状態です。もう一度アカウント作成からお試しください。
        sign_up: アカウント作成へ
  registrations:
    new:
      title: アカウント作成
      submit: アカウントを作成する
      password_hint: "%{count} 文字以上で入力してください。文字の種類は問いません。"
      sign_in: すでにアカウントをお持ちの方はこちら
  invitations:
    new:
      title: "%{organization} へ招待する"
      submit: 招待を送る
    invalid:
      title: この招待は使用できません
      body: 招待の有効期限が切れているか、すでに使用済みです。組織の担当者へ再度の招待を依頼してください。
      organizations: 所属する組織へ
    mismatched:
      title: この招待は別のメールアドレス宛です
      body: "現在 %{email_address} でログインしています。招待されたメールアドレスでログインし直してください。"
      organizations: 所属する組織へ
  operator:
    organizations:
      index:
        title: すべての組織
        owner_count: "管理者 %{count} 人"
      show:
        title: "%{organization} の運営"
        grant_owner: 管理者にする
        back: すべての組織へ
  public:
    job_postings:
      index:
        title: 求人を探す
        empty: 現在、公開中の求人はありません。
        no_results: 条件に一致する求人はありません。
        keyword: キーワード
        any_employment_type: すべての雇用形態
        any_currency: 通貨を指定しない
        minimum_salary: 最低年収
        submit: 絞り込む
      show:
        back: 求人の一覧へ
  organizations:
    index:
      title: 所属する組織
      empty: まだどの組織にも所属していません。
      new: 組織を作成する
      members: メンバーを見る
      job_postings: 求人を見る
    new:
      title: 組織の作成
      submit: 組織を作成する
  job_postings:
    index:
      title: "%{organization} の求人"
      new: 求人を作成する
      edit: 編集する
      submit: 公開を申請する
      approve: 承認して公開する
      reject: 差し戻す
      suspend: 公開を停止する
      empty: まだ求人がありません。
      preview: 公開時の表示を見る
      history: 公開状態の履歴
      created: を作成しました
      status_changed: の状態が %{from} から %{to} へ変わりました
      changed_by: "（実行: %{email_address}）"
      removed_account: 削除されたアカウント
    new:
      title: "%{organization} の求人を作成する"
      submit: 下書きとして保存する
    edit:
      title: 求人を編集する
      submit: 保存する
    preview:
      title: 公開時の表示
      notice: "これはプレビューです。この求人の状態は「%{status}」です。"
      back: 求人の一覧へ
    form:
      unspecified: 指定しない
    review:
      rejected_transition: この求人は、いまその操作を行える状態ではありません。
    statuses:
      draft: 下書き
      pending_review: 審査待ち
      published: 公開中
      rejected: 差し戻し
      suspended: 停止中
    salary_currencies:
      JPY: 円
      USD: 米ドル
      EUR: ユーロ
    salary_from: "%{amount} 以上"
    salary_up_to: "%{amount} まで"
    employment_types:
      full_time: 正社員
      part_time: パート・アルバイト
      contract: 契約
      internship: インターンシップ
  memberships:
    index:
      title: "%{organization} のメンバー"
      change_role: 役割を変更する
      submit: 変更する
      invite: メンバーを招待する
      history: 変更履歴
      joined: が %{role} として参加しました
      role_changed: の役割が %{from} から %{to} へ変わりました
      changed_by: "（実行: %{email_address}）"
      removed_account: 削除されたアカウント
    roles:
      owner: 管理者
      member: メンバー
  password_resets:
    new:
      title: パスワードの再設定
      body: 登録したメールアドレスを入力してください。再設定用のリンクをお送りします。
      submit: 再設定用のリンクを送る
    create:
      title: 再設定用のリンクを送信しました
      body: 入力されたメールアドレスが登録されている場合、再設定用のリンクを記載したメールが届きます。メールが届かない場合は、入力内容と迷惑メールフォルダーをご確認ください。
      sign_in: ログイン画面へ
    edit:
      title: 新しいパスワードの設定
      submit: パスワードを設定する
    update:
      success: パスワードを再設定しました。新しいパスワードでログインしてください。
    invalid:
      title: このリンクは使用できません
      body: リンクの有効期限が切れているか、すでに使用済みです。もう一度、再設定を依頼してください。
      retry: 再設定を依頼する
  shared:
    pagination:
      label: ページ送り
      previous: 前のページ
      next: 次のページ
  sessions:
    new:
      title: ログイン
      submit: ログインする
      sign_up: アカウントをお持ちでない方はこちら
      password_reset: パスワードをお忘れの方はこちら
    create:
      failure: メールアドレスまたはパスワードが正しくありません。
  home:
    show:
      summary: 自己ホスト可能な採用プラットフォームの基盤を開発しています。
      find_jobs: 求人を探す
  user_mailer:
    email_confirmation:
      subject: メールアドレスの確認
      greeting: RoleWeave をご利用いただきありがとうございます。
      body: 次の URL を開いて、メールアドレスの確認を完了してください。
      expiration: この URL の有効期限は %{count} 時間です。
      ignore: 心当たりがない場合は、このメールを破棄してください。
    password_reset:
      subject: パスワードの再設定
      greeting: パスワードの再設定を受け付けました。
      body: 次の URL を開いて、新しいパスワードを設定してください。
      expiration: この URL の有効期限は %{count} 分です。
      ignore: 心当たりがない場合は、このメールを破棄してください。パスワードは変更されません。
  organization_mailer:
    invitation:
      subject: "%{organization} への招待"
      greeting: "%{organization} からメンバーとして招待されています。"
      body: 次の URL を開いて、招待を受け入れてください。招待されたメールアドレスでログインした状態で開いてください。
      expiration: この URL の有効期限は %{count} 日です。
      ignore: 心当たりがない場合は、このメールを破棄してください。
