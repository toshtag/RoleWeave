id: P4
name: Job Posting Management
weight: 10
confidence: medium
risk: medium
status: planned
depends_on:
  - P3
objective: |-
  企業担当者が求人を作成し、審査を経て公開できるようにする。

  前提フェーズ: P3

  対象範囲: 求人下書き / 求人本文 / 勤務地 / 職種 / 雇用形態 / 給与 / 応募条件 /
  公開申請 / 審査 / 公開 / 停止 / 公開履歴 / プレビュー
non_goals:
  - 公開側の検索機能
  - 応募機能
  - 求人の自動生成
definition_of_done:
  - 求人の下書きを作成できる
  - 権限のない担当者は求人を編集できない
  - 公開申請と審査を経て公開できる
  - 公開中の求人を停止できる
  - 公開状態の変更が履歴として残る
verification:
  commands:
    - docker compose run --rm app bin/verify
