id: P13
name: Sourcing and Engagement
weight: 8
confidence: low
risk: medium
status: planned
objective: |-
  最近の採用サービスに必要な候補者発掘機能を、v0.1.0 後の拡張として追加する。
  重要度が低いという意味ではなく、
  最初のリリースを阻止する依存条件から外すという意味である。

  前提フェーズ: P12

  対象範囲: お気に入り求人 / 保存した検索条件 / 新着求人通知 / 候補者検索 /
  タレントプール / スカウト / スカウトテンプレート / 送信上限 / 配信停止 /
  重複送信防止 / 候補者側の公開・受信設定
non_goals:
  - 候補者の外部データ収集
  - スコアリングによる自動抽出
  - 有料プランによる上限制御
definition_of_done:
  - 求人を保存し検索条件を保存できる
  - 新着求人が通知される
  - 受信を許可した候補者だけを検索できる
  - スカウトを送信でき送信上限が機能する
  - 配信停止した候補者へ送信できない
verification:
  commands:
    - docker compose run --rm app bin/verify
