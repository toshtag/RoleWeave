      - design/rules/coding-style.md
      - design/rules/code-pact-execution.md
      - design/rules/task-scope.md
      - docs/architecture/principles.md
      - docs/development/code-pact.md
      - README.md
      - README.en.md
      - scripts/verify-p0
  - id: P0-T2B
