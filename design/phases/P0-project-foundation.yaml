id: P0
name: Project Foundation
weight: 8
confidence: high
risk: low
status: in_progress
depends_on: []
objective: |-
  開発者と AI Agent が、同じ環境、同じ規約、同じ検証方法で極小タスクを実装できる状態を作る。

  前提フェーズ: なし

  対象範囲: プロジェクト方針 / 言語・命名規則 / ライセンス /
  Rails アプリケーションの生成 / PostgreSQL / Docker Compose / 冪等なセットアップ /
  統一検証コマンド / GitHub Actions / 日本語・英語の初期設定 / 基本的なセキュリティ検査
non_goals:
  - 業務機能の実装
  - 認証の実装
  - 画面デザインの作り込み
  - 常設デモ環境の構築
  - デプロイ設定
definition_of_done:
  - 新規環境で docker compose up が成功する
  - 新規環境で docker compose run --rm app bin/setup が成功する
  - 新規環境で docker compose run --rm app bin/verify が成功する
  - bin/setup を再実行しても結果が変わらない
  - GitHub Actions で bin/verify が実行される
verification:
  commands:
    - bin/verify --full
