id: P9
name: Conversations and Notifications
weight: 8
confidence: medium
risk: medium
status: planned
objective: |-
  求職者と企業担当者が安全に連絡できるようにする。

  前提フェーズ: P8

  対象範囲: 会話スレッド / メッセージ / 既読 / 添付ファイル / アプリ内通知 /
  メール通知 / 配信設定 / 再送 / 配信失敗記録
non_goals:
  - リアルタイムチャット基盤の構築
  - 外部チャットサービス連携
  - 自動返信
definition_of_done:
  - 応募に紐づく会話でメッセージを送受信できる
  - 無関係な利用者が会話を参照できない
  - メッセージの既読が記録される
  - アプリ内通知とメール通知が配信される
  - 配信失敗が記録され再送できる
verification:
  commands:
    - docker compose run --rm app bin/verify
