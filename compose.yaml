# ローカル開発用の Docker Compose 定義。
#
# サービスは app と db の 2 つだけとする。
# 資格情報は開発専用の固定値であり、本番環境へ流用できる設計として扱わない。

# project 名を宣言しない場合、Compose は作業ディレクトリ名から導出する。
# clone 先の名前を変えると、container・network・volume の名前がまとめて変わり、
# 既存の roleweave_postgres_data を持ったまま別の project へ切り替わる。
# 表示される名前を、置き場所の都合で変わらないようにする。
name: roleweave

services:
  app:
    # ビルド結果に付ける名前を宣言する。
    #
    # 宣言しない場合、Compose は project 名とサービス名から roleweave-app:latest を導く。
    # ビルドするサービスは app だけであり、名前の中の app は何も区別していない。
    #
    # 導出に任せると、project 名を変えたときに別のタグが生まれる。
    # 検証は専用の project 名を使うため（scripts/verify-p0-docker）、
    # 実行中は同じ中身のイメージが docker images に 2 件並ぶ。
    image: roleweave:development
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        RUBY_VERSION: "4.0.6"
    init: true
    command:
      - bin/rails
      - server
      - -b
      - 0.0.0.0
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: roleweave
      DATABASE_PASSWORD: roleweave
    ports:
      # ホスト IP を省略すると全インターフェースへ公開される。
      # ローカル開発用のため IPv4 ループバックだけへバインドする。
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      # 作業ツリーは bind mount し、依存キャッシュは named volume で分離する。
      - .:/workspace
      - bundle:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    # 起動中と常駐中で確認の間隔を分ける。
    #
    # bin/docker-healthcheck は 1 回あたり約 100 ms（Ruby の起動が約 60 ms）で、
    # 起動が終わった後もその間隔で払い続ける。
    # 判定を急ぎたいのは起動中だけなので、そこだけ start_interval で詰める。
    #
    # docker compose run の一時コンテナも healthcheck を実行する。
    # 常駐側の間隔は、そちらの無駄も同じだけ減らす。
    healthcheck:
      test:
        - CMD
        - bin/docker-healthcheck
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    stdin_open: true
    tty: true

  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: roleweave
      POSTGRES_PASSWORD: roleweave
      POSTGRES_DB: role_weave_development
    volumes:
      # PostgreSQL 18 では永続データのマウント先が /var/lib/postgresql へ変更されている。
      # 17 以前の /var/lib/postgresql/data をマウントしても永続化されない。
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U roleweave -d role_weave_development
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s

volumes:
  bundle:
  postgres_data:

# 既定の network の表示名を宣言する。
#
# 宣言しない場合、Compose は project 名へ _default を足して roleweave_default とする。
# network は 1 つしか無く、既定であることを区別する相手がいない。
#
# 値は project 名から取る。roleweave と直接書くと、
# --project-name を変えても同じ network を指したままになる。
# 検証は専用の project 名で同じ compose.yaml を使うため（scripts/verify-p0-docker）、
# 検証中の app と開発中の app が 1 つの network に同居し、
# どちらの db へ繋がるかが起動順で決まることになる。
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}
